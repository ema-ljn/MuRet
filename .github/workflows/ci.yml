# CI de MuRet: verifica el formato del C++ y, en Linux y en Windows, configura, compila y corre los
# tests con los mismos presets que se usan a mano (CMakePresets.json) y las dependencias de
# vcpkg.json (modo manifiesto). Warnings como errores, como pide docs/CODING_RULES.md.
#
# El repo es público: los runners estándar de GitHub tienen 4 vCPU y 16 GB, y los minutos no se
# cobran. Por eso lo lento va en jobs aparte que corren a la vez (los includes, el perfil
# matemático en Release) y cada job usa sus cuatro núcleos.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# En un PR, un push nuevo cancela la corrida vieja. En main no: cada merge tiene que quedar con
# su resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # El formato de todo el C++ del repo, con el .clang-format del repo (el de MuMain). Va aparte y
  # sin vcpkg: tarda segundos. clang-format-18 es el que da apt en ubuntu-24.04, la misma versión
  # mayor que se usa a mano. Lo que clang-format no mira (el orden de la cabecera, los nombres) lo
  # pide la regla 7, y Server/ y labs/0.0-enlace lo siguen cuando se toca cada archivo.
  format:
    name: Formato (clang-format 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # El DNS de los runners a veces no resuelve el espejo de Ubuntu por unos minutos: apt reintenta cada
      # descarga y el lazo repite todo hasta cinco veces, con 30 s, 60 s, ... de espera.
      - name: clang-format-18
        run: |
          for attempt in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=5 update &&
              sudo apt-get -o Acquire::Retries=5 install -y clang-format-18 && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
          clang-format-18 --version

      - name: Verificar el formato
        run: |
          git ls-files -z -- 'Client/*.h' 'Client/*.cpp' 'labs/*.h' 'labs/*.cpp' 'Server/*.h' 'Server/*.cpp' \
            | xargs -0 clang-format-18 --dry-run --Werror

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # kind dice qué hace cada job con el mismo arranque (paquetes, vcpkg, configurar):
          # build compila todo y corre los tests; includes corre solo el include-cleaner, que no
          # necesita compilar; math-release arma en Release solo lo del perfil matemático.
          #
          # Linux compila sin precompiled headers: así un archivo que no incluye lo que usa falla
          # acá aunque el header precompilado se lo traiga (cmake/PrecompiledHeaders.cmake).
          # Windows, el job más lento, los usa.
          - name: Linux (GCC, Debug)
            kind: build
            os: ubuntu-24.04
            configure-preset: linux-x64-debug
            build-preset: linux-x64-debug
            test-preset: linux-x64-debug
            precompiled-headers: 'OFF'
            # Los ejecutables de test enlazan ClientLib con toda su información de depuración: los de
            # scenes pesan ~100 MB cada uno y el build entero pasa los 14 GB que GitHub garantiza en
            # el disco del runner. Comprimidas con zlib no alcanzó: con el hito 8 (#346) el runner se
            # cayó dos veces seguidas en el mismo enlace (1572 de 1874, los test_game_scene_*) sin
            # dejar error, como en #361. El enlazador descarta la depuración de los ejecutables
            # (--strip-debug): los 590 de test pesan 5,2 GB en vez de 27 GB (medido en local con
            # GCC 13). Desde #379 tampoco se compila con -g (CMAKE_CXX_FLAGS_DEBUG vacío): los .o
            # pesan menos y entran en la caché de ccache. Lo que el job verifica no cambia; un build
            # a mano con el preset sigue teniendo la depuración entera.
            extra-configure: >-
              -DCMAKE_EXE_LINKER_FLAGS=-Wl,--strip-debug -DCMAKE_CXX_FLAGS_DEBUG=
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            # Also each header of the engine's libraries compiled alone (VERIFY_INTERFACE_HEADER_SETS).
            build-targets: --target all all_verify_interface_header_sets
            ccache-key: ccache-ubuntu-24.04
            font-file: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          # Con Ninja y cl desde el entorno de MSVC (paso "Entorno de MSVC"), no con MSBuild: MSBuild
          # compilaba ClientLib en un solo núcleo (21 minutos) y no lo mejoraron ni /MP ni 4
          # proyectos a la vez (#379). Ninja reparte todos los archivos entre los núcleos, como en
          # Linux, y deja usar ccache. Sin información de depuración, como el --strip-debug de
          # Linux: ccache no guarda lo compilado con /Zi, y sin PDB los 690 enlaces no lo arman.
          # Lo que el job verifica sigue igual: /Od, /RTC1, el runtime de depuración con sus
          # iteradores verificados, /W4 /WX y la pila de 1 MB.
          - name: Windows (MSVC, Debug)
            kind: build
            os: windows-2022
            configure-preset: windows-x64-ninja-debug
            build-preset: windows-x64-ninja-debug
            test-preset: windows-x64-ninja-debug
            precompiled-headers: 'ON'
            extra-configure: >-
              -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT= -DCMAKE_EXE_LINKER_FLAGS_DEBUG=/INCREMENTAL:NO
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            # Ninja corre por defecto núcleos + 2 = 6 compilaciones a la vez: con 6 cl de Scenes/
            # juntos el runner se quedó sin memoria (C1060, "compiler is out of heap space", #379).
            # De a 4, cada test de tests/scenes tardó 3 a 4 min en compilar (memoria): el build sin caché
            # pasó las 2 h. De a 2, 31 a 34 s cada uno y 53 min el build entero sin caché (#379).
            build-jobs: '2'
            ccache-key: ccache-windows-2022
            font-file: 'C:\Windows\Fonts\arial.ttf'
          # Que cada archivo del cliente incluya lo que usa (docs/CODING_RULES.md § 7). Antes iba al
          # final del job de Linux y le sumaba 12 a 18 minutos; clang-tidy solo lee el
          # compile_commands.json, así que corre a la vez que los builds.
          - name: Includes (clang-tidy 18)
            kind: includes
            os: ubuntu-24.04
            configure-preset: linux-x64-debug
            build-preset: linux-x64-debug
            test-preset: linux-x64-debug
            precompiled-headers: 'OFF'
            extra-configure: ''
            font-file: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          # El perfil matemático retenido en MSVC x64 Release (ADR 0014). Antes iba después de los
          # tests de Windows y le sumaba 26 a 31 minutos.
          # Ninja, ccache and two jobs, as in Windows Debug: with MSBuild, building Main took 31 of
          # this job's 33 minutes (#407). Its own ccache key: Debug objects never match Release.
          # MU_XOR_REMAP=OFF here, so every PR also builds and links Main without the layer, and
          # MU_MONOLITHIC=ON, so every PR also builds the engine's libraries static, as one binary (ADR 0028).
          - name: Windows (MSVC, Release, matemática)
            kind: math-release
            os: windows-2022
            configure-preset: windows-x64-ninja-release
            build-preset: windows-x64-ninja-release
            test-preset: windows-x64-ninja-release
            precompiled-headers: 'ON'
            extra-configure: -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DMU_XOR_REMAP=OFF -DMU_MONOLITHIC=ON
            build-jobs: '2'
            build-targets: >-
              --target Main test_original_angles test_original_retained_math test_rounded_math
              test_rounded_transforms test_half_life_math test_make_obfuscation
            ccache-key: ccache-release-windows-2022
            font-file: 'C:\Windows\Fonts\arial.ttf'
    env:
      VCPKG_DISABLE_METRICS: 1
      # La fuente de los tests de FreeType (CL5.3, support/GoldenDir.h): una del runner. Con la
      # variable puesta, un archivo que falta o que no es una fuente hace fallar los tests.
      MU_CLIENT_FONT_FILE: ${{ matrix.font-file }}
      # Los cuatro núcleos del runner, para CTest (Ninja ya los usa todos).
      MU_CI_JOBS: 4
      # Cuántas compilaciones a la vez en cmake --build; vacía, lo que elija Ninja.
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.build-jobs }}

    steps:
      # Dos commits: en un PR, HEAD es el merge con la base y HEAD^1 la base, así el paso de lo que
      # cambió sabe qué tocó el PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A PR that changes nothing the build reads (docs, the Python tools, the agents' files) skips the rest of the
      # job except the Python checks, and the job still ends green. Not a job-level if: it is evaluated before the
      # matrix expands, so the required checks ("Linux (GCC, Debug)"...) would never report. Outside a PR, all runs.
      - name: What the PR changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          build=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            build=false
            while IFS= read -r path; do
              case "$path" in
                *.md | docs/* | Client/docs/* | Client/tools/* | .claude/* | .git-blame-ignore-revs) ;;
                .github/workflows/referencia.yml) ;;
                *) build=true; echo "Builds because of $path"; break ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

      - name: Tests de las herramientas de evidencia CL9
        if: matrix.kind == 'build'
        run: python -m unittest discover -s Client/docs/research/scripts/game/capture -p 'test_*evidence.py' -v

      # The reference tools (.github/workflows/referencia.yml): its summary, the anchors of the hand-classified
      # cuts and the matrix's commit waves (AR0.2), with made-up tables and git repos.
      - name: Reference tools tests
        if: matrix.kind == 'build'
        run: |
          python -m unittest discover -s Client/docs/research/scripts/tools -p 'test_reference_*.py' -v
          python -m unittest discover -s Client/docs/research/scripts/tools -p 'test_commit_waves.py' -v

      # Client refactor (AR0.1): a new include that breaks the module layers, or a file without a module, fails.
      # Since AR1.1 the engine has none at all: its violations fail even if the baseline lists them.
      - name: Client layers
        if: matrix.kind == 'includes'
        run: |
          python3 -I -m unittest discover -s Client/tools/architecture -p 'test_*.py' -v
          python3 -I Client/tools/architecture/check_layers.py --src Client/src --modules Client/modules.tsv \
            --map Client/docs/research/coverage/module-map.tsv \
            --baseline Client/tools/architecture/layers-baseline.tsv --clean-root engine

      - name: Client named values
        if: matrix.kind == 'includes'
        run: |
          python3 -I Client/tools/architecture/check_named_values.py --src Client/src --modules Client/modules.tsv \
            --map Client/docs/research/coverage/module-map.tsv --spaces Client/tools/architecture/named-values.tsv \
            --baseline Client/tools/architecture/named-values-baseline.tsv

      # ADR 0027: math that the C library or glm rounds, called by name instead of through RoundedMath.h, fails.
      - name: Client rounded math
        if: matrix.kind == 'includes'
        run: |
          python3 -I Client/tools/architecture/check_rounded_math.py --src Client/src Client/tests \
            --exceptions Client/tools/architecture/rounded-math-exceptions.tsv

      # Client refactor (AR0.2): in a PR titled type(ARn) or type(ARn.m), a moved file may only change its includes;
      # in a docs(ARn.m) PR, only comments may change and every cited address stays cited. HEAD^1 is the base.
      - name: Refactor moves and comments
        if: matrix.kind == 'includes' && github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^[a-z]+\(AR[0-9]+(\.[0-9]+)?\)!?: ]]; then
            echo "Not a refactor PR: nothing to check."
            exit 0
          fi
          python3 -I Client/tools/architecture/check_pure_move.py --base HEAD^1 --head HEAD
          if [[ "$TITLE" =~ ^docs\(AR[0-9]+\.[0-9]+\): ]]; then
            python3 -I Client/tools/architecture/check_comments_only.py --base HEAD^1 --head HEAD
          fi

      # Lo que los puertos sdl3 y alsa de vcpkg piden del sistema, los headers de OpenGL/EGL,
      # y Xvfb + Mesa (llvmpipe) para abrir la ventana sin pantalla. NASM lo
      # pide el puerto libjpeg-turbo para su SIMD: en Linux, vcpkg no lo baja y usa el del sistema
      # (en Windows sí lo baja). ccache, para no recompilar lo que no cambió. clang-tidy-18, para
      # el job de los includes.
      - name: Paquetes del sistema (Linux)
        if: steps.scope.outputs.build == 'true' && runner.os == 'Linux'
        # Con los mismos reintentos que el paso del formato.
        run: |
          for attempt in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=5 update &&
              sudo apt-get -o Acquire::Retries=5 install -y ninja-build pkg-config \
                autoconf autoconf-archive automake libtool \
                libx11-dev libxext-dev \
                libwayland-dev libxkbcommon-dev \
                libgl-dev libegl-dev \
                nasm \
                xvfb libgl1-mesa-dri \
                ccache \
                clang-tidy-18 && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 30))
          done

      # La DejaVu de MU_CLIENT_FONT_FILE viene en la imagen de ubuntu-24.04; si una imagen nueva
      # no la trae, se instala.
      - name: Fuente de los tests (Linux)
        if: steps.scope.outputs.build == 'true' && runner.os == 'Linux' && matrix.kind == 'build'
        run: |
          if [ ! -f "$MU_CLIENT_FONT_FILE" ]; then
            sudo apt-get install -y fonts-dejavu-core
          fi
          test -f "$MU_CLIENT_FONT_FILE"

      # El build de Debug con los ~600 ejecutables de test no entra en el disco libre del runner, y
      # cuando el disco se llena el runner pierde la conexión sin dejar el log ("The hosted runner lost
      # communication with the server", 2026-11-17 en #361). Se borran SDKs de la imagen que este job
      # no usa (Android, .NET, Haskell y CodeQL; el SDK de Android se puede borrar justamente para
      # esto, actions/runner-images) y se muestra el disco y la memoria antes de compilar.
      - name: Espacio en disco (Linux)
        if: steps.scope.outputs.build == 'true' && runner.os == 'Linux' && matrix.kind == 'build'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /
          free -h

      # vcpkg clonado entero (con historia: el versionado lo necesita) y parado en la
      # builtin-baseline de vcpkg.json, para que CI use las mismas versiones que todos.
      - name: vcpkg en la baseline de vcpkg.json
        if: steps.scope.outputs.build == 'true'
        shell: bash
        run: |
          temp="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          baseline="$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)"
          git clone https://github.com/microsoft/vcpkg "$temp/vcpkg"
          git -C "$temp/vcpkg" checkout --quiet "$baseline"
          mkdir -p "$temp/vcpkg-cache"
          echo "VCPKG_ROOT=$temp/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$temp/vcpkg-cache" >> "$GITHUB_ENV"
          # La imagen del runner (y con ella el compilador) entra en la clave de la caché.
          echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Bootstrap de vcpkg (Linux)
        if: steps.scope.outputs.build == 'true' && runner.os == 'Linux'
        run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Bootstrap de vcpkg (Windows)
        if: steps.scope.outputs.build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: '& (Join-Path $env:VCPKG_ROOT "bootstrap-vcpkg.bat") -disableMetrics'

      # Los paquetes ya compilados (SDL3, GoogleTest) se guardan entre corridas. Una clave que ya
      # existe no se vuelve a guardar, así que lleva la imagen del runner: cuando cambia el
      # compilador, la primera corrida recompila y guarda una caché nueva.
      - name: Caché de binarios de vcpkg
        if: steps.scope.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ env.RUNNER_IMAGE }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}
          restore-keys: vcpkg-${{ env.RUNNER_IMAGE }}-

      # cl, link y los headers y bibliotecas de Windows en el PATH, INCLUDE y LIB, como en una
      # consola "x64 Native Tools" de Visual Studio: lo que necesita Ninja, que no los busca solo como
      # MSBuild. Pasa a los pasos siguientes solo lo que vcvars64.bat agrega o cambia, menos
      # VCPKG_ROOT: vcvars64.bat lo apunta al vcpkg de Visual Studio, y el build usa el clonado en la
      # baseline (paso "vcpkg en la baseline de vcpkg.json"). Las carpetas
      # nuevas del PATH van en el mismo orden que les da vcvars64.bat (GITHUB_PATH antepone cada
      # línea a las anteriores, por eso se escriben al revés).
      - name: Entorno de MSVC (Windows)
        if: steps.scope.outputs.build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No hay un Visual Studio con las herramientas de C++ x64' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          # Un .cmd sin espacios en la ruta: así las comillas de la ruta de Visual Studio no pasan
          # por las reglas de cmd /c.
          $script = Join-Path $env:RUNNER_TEMP 'vcvars64-set.cmd'
          Set-Content -Path $script -Encoding ascii -Value "@call `"$vcvars`" >nul", '@set'
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $oldPath = $env:Path -split ';'
          $lines = cmd /c $script
          if (-not ($lines -match '^VCToolsInstallDir=')) { throw 'vcvars64.bat no dejó el entorno de MSVC' }
          $newPath = @()
          foreach ($line in $lines) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name = $Matches[1]
            $value = $Matches[2]
            if ($name -eq 'Path') {
              $newPath = @($value -split ';' | Where-Object { $_ -and ($oldPath -notcontains $_) })
            } elseif ($name -ne 'VCPKG_ROOT' -and $before[$name] -ne $value) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          [array]::Reverse($newPath)
          $newPath | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # ccache guarda cada .o y .obj compilado: lo que un push no cambió sale de la caché en vez de
      # recompilarse. En Windows, la versión que soporta cl oficialmente (desde la 4.13), con su
      # SHA-256; en Linux, la de apt.
      - name: ccache (Windows)
        if: steps.scope.outputs.build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '4.13.5'
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$version/ccache-$version-windows-x86_64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '6685aa505f0a95a3a6d8b6c1b6fab1deff29628e44ded4a5760e4efe1742a736') { throw "SHA-256 inesperado: $hash" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP "ccache-$version-windows-x86_64"
          & (Join-Path $dir 'ccache.exe') --version
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Qué cl, link, ninja y cmake quedaron primero en el PATH con el paso anterior.
          Get-Command cl, link, ninja, cmake | Format-Table -AutoSize Name, Source

      # La caché de ccache de la corrida anterior: la última de este PR o, si no hay, la de main.
      # Cada corrida guarda la suya al final (paso "Guardar la caché de ccache"), también si falló.
      - name: Restaurar la caché de ccache
        id: ccache
        if: steps.scope.outputs.build == 'true' && matrix.kind != 'includes'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ matrix.ccache-key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ matrix.ccache-key }}-

      # pch_defines,time_macros: lo que ccache pide para cachear con precompiled headers. El modo
      # depend toma los includes de /showIncludes o -MD (que Ninja ya pide) en vez de correr el
      # preprocesador aparte en cada archivo que no está en la caché. compiler_check=content: por
      # defecto ccache identifica el compilador por la fecha y el tamaño de cl.exe o g++, que cambian
      # con cada imagen nueva del runner aunque el compilador sea el mismo (#379: con la imagen de
      # Windows del 16/11, 3 aciertos de 1462). Con el contenido, solo un compilador distinto vacía la caché.
      - name: Configurar ccache
        if: steps.scope.outputs.build == 'true' && matrix.kind != 'includes'
        shell: bash
        run: |
          dir="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/ccache"
          {
            echo "CCACHE_DIR=$dir"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros"
            echo "CCACHE_DEPEND=true"
            echo "CCACHE_COMPILERCHECK=content"
          } >> "$GITHUB_ENV"
          export CCACHE_DIR="$dir"
          ccache --version | head -n 1
          ccache --zero-stats

      - name: Configurar
        if: steps.scope.outputs.build == 'true'
        run: >-
          cmake --preset ${{ matrix.configure-preset }} -DMU_WARNINGS_AS_ERRORS=ON
          -DMU_PRECOMPILED_HEADERS=${{ matrix.precompiled-headers }} ${{ matrix.extra-configure }}

      # En un PR, primero ClientLib y los tests cuyos test_*.cpp tocó el PR, y esos tests. Un error
      # en lo que cambió (un C4242 de MSVC, una pila que no alcanza) aparece a los pocos minutos en
      # vez de al final del build entero. Lo que se compila acá el paso siguiente ya no lo repite.
      # Con más de 40 archivos de test tocados va directo al build entero.
      - name: Compilar y probar primero lo que cambió (PR)
        if: steps.scope.outputs.build == 'true' && matrix.kind == 'build' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- 'Client/tests/*/test_*.cpp')
          echo "Archivos de test tocados: ${#changed[@]}"
          printf '  %s\n' "${changed[@]}"
          if [ "${#changed[@]}" -gt 40 ]; then
            echo "Más de 40: se compila todo en el paso siguiente."
            exit 0
          fi
          build="build/${{ matrix.configure-preset }}"
          # A test of the other system's code (mu_add_module_tests OTHER_SYSTEM) has no target here.
          # A set, not grep -q: grep would stop reading early and, with pipefail, drop a test at random.
          ninja_targets="$(ninja -C "$build" -t targets all)"
          declare -A known=()
          while IFS= read -r name; do known["$name"]=1; done \
            < <(printf '%s\n' "$ninja_targets" | tr -d '\r' | sed -n 's/^\(test_[^:]*\): phony$/\1/p')
          [ "${#known[@]}" -gt 0 ] || { echo "Ninja listed no test targets in $build"; exit 1; }
          kept=()
          for path in "${changed[@]}"; do
            name="$(basename "$path" .cpp)"
            if [ -n "${known[$name]:-}" ]; then
              kept+=("$path")
            else
              echo "No target on this system: $path"
            fi
          done
          changed=("${kept[@]}")
          targets=(ClientLib)
          for path in "${changed[@]}"; do
            targets+=("$(basename "$path" .cpp)")
          done
          cmake --build --preset ${{ matrix.build-preset }} --target "${targets[@]}"
          [ "${#changed[@]}" -gt 0 ] || exit 0
          # Las suites de esos ejecutables, para correr con CTest solo sus tests (cada TEST es un
          # test de CTest con el nombre de su suite, ver Client/tests/CMakeLists.txt).
          suites=()
          for path in "${changed[@]}"; do
            name="$(basename "$path" .cpp)"
            exe="$build/bin/$name"
            if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
            while IFS= read -r suite; do suites+=("$suite"); done \
              < <("$exe" --gtest_list_tests | tr -d '\r' | sed -n 's/^\([^ #][^ ]*\)\.\( .*\)\{0,1\}$/\1/p')
          done
          [ "${#suites[@]}" -gt 0 ] || exit 0
          regex="^($(printf '%s\n' "${suites[@]}" | awk '!seen[$0]++' | paste -sd '|' -))\\."
          echo "Suites: $regex"
          ctest --preset ${{ matrix.test-preset }} --parallel "$MU_CI_JOBS" -R "$regex" --no-tests=error

      # math-release builds only Main, the tests of the math profile and the test of the factory without the layer.
      - name: Compilar
        if: steps.scope.outputs.build == 'true' && matrix.kind != 'includes'
        run: cmake --build --preset ${{ matrix.build-preset }} ${{ matrix.build-targets }}

      # Se guarda también si el build falló: el push que lo arregla encuentra compilado todo lo
      # que llegó a compilar esta corrida.
      - name: Guardar la caché de ccache
        if: always() && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # Cuánto dejó el build, también si falló, para ver de antemano si el disco vuelve a quedar justo.
      - name: Disco y memoria después de compilar (Linux)
        if: always() && steps.scope.outputs.build == 'true' && runner.os == 'Linux' && matrix.kind == 'build'
        run: |
          df -h /
          free -h
          du -sh build/${{ matrix.configure-preset }} || true

      # De a cuatro procesos: cada TEST corre en su propio proceso (gtest_discover_tests) y los que
      # escriben en la carpeta temporal usan nombres al azar.
      - name: Tests
        if: steps.scope.outputs.build == 'true' && matrix.kind == 'build'
        run: ctest --preset ${{ matrix.test-preset }} --parallel ${{ env.MU_CI_JOBS }}

      # Main and the tests come from "Compilar". Zero selected tests also fails the job, so a
      # move or a rename of these tests cannot turn the check off. The rounded math runs here too:
      # the optimizer must not change its bits. MakeObfuscationTest checks the factory without the layer.
      - name: Perfil matemático en MSVC Release
        if: steps.scope.outputs.build == 'true' && matrix.kind == 'math-release'
        run: >-
          ctest --preset ${{ matrix.test-preset }} --no-tests=error
          -R '^(OriginalAnglesTest|OriginalRetainedMathTest|RoundedMathTest|RoundedTransformsTest|HalfLifeMathTest|MakeObfuscationTest)\.'

      # An outside library has one owner or is shared (ADR 0028): Platform and Audio load the one libSDL3.so beside
      # them, and no other binary defines SDL's, SDL3_mixer's, libjpeg-turbo's or FreeType's symbols. awk reads its
      # whole input: grep -q would close the pipe early and, with pipefail, fail at random.
      - name: Who owns each outside library (Linux)
        if: steps.scope.outputs.build == 'true' && runner.os == 'Linux' && matrix.kind == 'build'
        shell: bash
        run: |
          set -euo pipefail
          bin=build/${{ matrix.configure-preset }}/bin
          definers() {
            for file in "$bin"/lib*.so* "$bin"/main; do
              if nm -D --defined-only "$file" | awk -v symbol="$1" '{ sub(/@.*/, "", $NF) } $NF == symbol { found = 1 } END { exit !found }'; then
                basename "$file"
              fi
            done | paste -sd ' ' -
          }
          only() {
            found="$(definers "$2")"
            echo "$1 ($2): ${found:-nobody}"
            [ -z "$found" ] || [ "$found" = "$3" ] || { echo "::error::$1 should be defined only by $3"; exit 1; }
          }
          [ "$(definers SDL_Init)" = libSDL3.so.0 ] || { echo "::error::SDL3 is not the shared library in bin/"; exit 1; }
          only SDL3 SDL_Init libSDL3.so.0
          only SDL3_mixer MIX_Init libAudio.so
          only libjpeg-turbo jpeg_read_header libEngine.so
          only FreeType FT_Init_FreeType libEngine.so
          for library in libPlatform.so libAudio.so; do
            readelf -d "$bin/$library" | awk '/NEEDED/ && /libSDL3\.so/ { found = 1 } END { exit !found }' \
              || { echo "::error::$library does not load libSDL3.so"; exit 1; }
          done

      # Los tests con la etiqueta gl (desde la CL5.0, los de labs/cl5.0-pipeline/gl/) abren una
      # ventana escondida con OpenGL 3.3 core, dibujan en un framebuffer y leen los píxeles. En el
      # paso de Tests se saltean porque no hay pantalla; acá corren en Xvfb con
      # MU_CLIENT_REQUIRE_GL=1, que los hace fallar si el Xvfb no da el contexto, en vez de
      # dejarlos salteados en silencio. Con --no-tests=error, si ningún test lleva la etiqueta,
      # también falla. La etiqueta es una regex: '^gl$' no toma otra que la contenga. En Windows
      # no va: el runner tiene solo el OpenGL 1.1 de GDI.
      - name: Tests de GL en Xvfb (Linux)
        if: steps.scope.outputs.build == 'true' && runner.os == 'Linux' && matrix.kind == 'build'
        env:
          MU_CLIENT_REQUIRE_GL: 1
        run: xvfb-run -a -s '-screen 0 800x600x24' ctest --preset ${{ matrix.test-preset }} -L '^gl$' --no-tests=error

      # El hola mundo de la CL0.3: abre la ventana con OpenGL 3.3 core, dibuja 60 frames y sale.
      # En Windows no hay driver de OpenGL 3.3 en el runner (solo el 1.1 de GDI), así que va solo acá.
      # Con --vsync off, el bucle de la CL3.2 corre sin esperar el retrazo; con --pacing faithful,
      # al ritmo del original (VSync apagado, como pide ese modo).
      - name: Ventana de la CL0.3 en Xvfb (Linux)
        if: steps.scope.outputs.build == 'true' && runner.os == 'Linux' && matrix.kind == 'build'
        run: |
          xvfb-run -a -s '-screen 0 800x600x24' build/${{ matrix.configure-preset }}/bin/main --frames 60
          xvfb-run -a -s '-screen 0 800x600x24' build/${{ matrix.configure-preset }}/bin/main --frames 60 --vsync off
          xvfb-run -a -s '-screen 0 800x600x24' build/${{ matrix.configure-preset }}/bin/main --frames 60 --pacing faithful

      # Que cada archivo del cliente incluya lo que usa (docs/CODING_RULES.md § 7): el check
      # misc-include-cleaner de clang-tidy 18, con las opciones y el WarningsAsErrors de
      # .clang-tidy, así que un hallazgo corta el job. Solo ese check: los otros de .clang-tidy
      # todavía tienen hallazgos en Client/. Va en su job, sin precompiled headers, y lee el
      # compile_commands.json del CMake raíz: no hace falta compilar (the only generated headers, the
      # libraries' *Api.h, come from configuring).
      # Sus comandos son de GCC y clang-tidy los toma tal cual (only the headers of tests/ add an
      # --extra-arg, below). include-cleaner
      # mira solo el archivo principal de cada compilación: los .cpp van con run-clang-tidy, y los
      # headers, que no están en esa base, de a uno; para cada uno, clang-tidy toma el comando del
      # .cpp más parecido.
      - name: Includes con clang-tidy (Linux)
        if: steps.scope.outputs.build == 'true' && matrix.kind == 'includes'
        run: |
          clang-tidy-18 --version
          build=build/${{ matrix.configure-preset }}
          run-clang-tidy-18 -clang-tidy-binary clang-tidy-18 -p "$build" -quiet \
            -checks='-*,misc-include-cleaner' 'Client/(src|tests)/'
          git ls-files -z -- 'Client/src/*.h' \
            | xargs -0 -P "$(nproc)" -n 8 clang-tidy-18 -p "$build" -quiet -checks='-*,misc-include-cleaner'
          # A header of tests/ borrows the command of a neighbor, which may see less than the header does: one that
          # links only the engine has no include folder of the game (tests/CMakeLists.txt, mu_reaches_game), and one
          # that does not link Platform lacks its definition. Which neighbor it is depends on the paths, so both go
          # by hand.
          git ls-files -z -- 'Client/tests/*.h' \
            | xargs -0 -P "$(nproc)" -n 8 clang-tidy-18 -p "$build" -quiet -checks='-*,misc-include-cleaner' \
                --extra-arg="-I$PWD/Client/src" --extra-arg="-I$PWD/Client/src/game" \
                --extra-arg=-DSDL_OPENGL_1_FUNCTION_TYPEDEFS

      # Al final del job, porque por la API se leen solo las últimas 5000 líneas del log y CTest escribe
      # más de 20 000. También van al resumen de la corrida, para verlos sin abrir el log.
      # Los 25 archivos que más tardaron en compilar o enlazar (de .ninja_log), para saber dónde se va
      # el tiempo. Con la caché llena aparece solo lo que se recompiló. /usr/bin/sort: en Windows,
      # sort a secas puede ser el de System32. awk y no head: head cortaría el pipe antes de que sort
      # termine de escribir, y con pipefail el paso fallaría.
      - name: Lo más lento del build
        if: always() && steps.scope.outputs.build == 'true' && matrix.kind != 'includes'
        shell: bash
        run: |
          log="build/${{ matrix.configure-preset }}/.ninja_log"
          [ -f "$log" ] || exit 0
          lento="$(awk -F'\t' '!/^#/ { printf "%8.1f s  %s\n", ($2 - $1) / 1000, $4 }' "$log" \
            | LC_ALL=C /usr/bin/sort -rn | awk 'NR <= 25')"
          # Every link's output is in bin/ (ADR 0028): how many there were and what they add up to.
          enlaces="$(awk -F'\t' '!/^#/ && $4 ~ /^bin\// { n += 1; s += ($2 - $1) / 1000 }
            END { printf "%d links, %.0f s in all", n, s }' "$log")"
          printf '%s\n%s\n' "$lento" "$enlaces"
          { echo '### Lo más lento del build'; echo '```'; printf '%s\n%s\n' "$lento" "$enlaces"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Cuántos archivos salieron de la caché y cuántos se compilaron, también si el build falló.
      - name: Estadísticas de ccache
        if: always() && steps.ccache.outcome == 'success'
        shell: bash
        run: |
          stats="$(ccache --show-stats --verbose)"
          printf '%s\n' "$stats"
          { echo '### ccache'; echo '```'; printf '%s\n' "$stats"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
