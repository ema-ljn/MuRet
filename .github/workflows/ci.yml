# CI de MuRet: verifica el formato del C++ y, en Linux y en Windows, configura, compila y corre los
# tests con los mismos presets que se usan a mano (CMakePresets.json) y las dependencias de
# vcpkg.json (modo manifiesto). Warnings como errores, como pide docs/CODING_RULES.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# En un PR, un push nuevo cancela la corrida vieja. En main no: cada merge tiene que quedar con
# su resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # El formato de todo el C++ del repo, con el .clang-format del repo (el de MuMain). Va aparte y
  # sin vcpkg: tarda segundos. clang-format-18 es el que da apt en ubuntu-24.04, la misma versión
  # mayor que se usa a mano. Lo que clang-format no mira (el orden de la cabecera, los nombres) lo
  # pide la regla 7, y Server/ y labs/0.0-enlace lo siguen cuando se toca cada archivo.
  format:
    name: Formato (clang-format 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: clang-format-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          clang-format-18 --version

      - name: Verificar el formato
        run: |
          git ls-files -z -- 'Client/*.h' 'Client/*.cpp' 'labs/*.h' 'labs/*.cpp' 'Server/*.h' 'Server/*.cpp' \
            | xargs -0 clang-format-18 --dry-run --Werror

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC, Debug)
            os: ubuntu-24.04
            configure-preset: linux-x64-debug
            build-preset: linux-x64-debug
            test-preset: linux-x64-debug
          - name: Windows (MSVC, Debug)
            os: windows-2022
            configure-preset: windows-x64
            build-preset: windows-x64-debug
            test-preset: windows-x64-debug
    env:
      VCPKG_DISABLE_METRICS: 1

    steps:
      - uses: actions/checkout@v7

      # Lo que el puerto sdl3 de vcpkg pide del sistema para las features x11 y wayland, los
      # headers de OpenGL/EGL, y Xvfb + Mesa (llvmpipe) para abrir la ventana sin pantalla. NASM lo
      # pide el puerto libjpeg-turbo para su SIMD: en Linux, vcpkg no lo baja y usa el del sistema
      # (en Windows sí lo baja).
      - name: Paquetes del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev \
            libwayland-dev libxkbcommon-dev \
            libgl-dev libegl-dev \
            nasm \
            xvfb libgl1-mesa-dri

      # vcpkg clonado entero (con historia: el versionado lo necesita) y parado en la
      # builtin-baseline de vcpkg.json, para que CI use las mismas versiones que todos.
      - name: vcpkg en la baseline de vcpkg.json
        shell: bash
        run: |
          temp="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          baseline="$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)"
          git clone https://github.com/microsoft/vcpkg "$temp/vcpkg"
          git -C "$temp/vcpkg" checkout --quiet "$baseline"
          mkdir -p "$temp/vcpkg-cache"
          echo "VCPKG_ROOT=$temp/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$temp/vcpkg-cache" >> "$GITHUB_ENV"
          # La imagen del runner (y con ella el compilador) entra en la clave de la caché.
          echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Bootstrap de vcpkg (Linux)
        if: runner.os == 'Linux'
        run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Bootstrap de vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& (Join-Path $env:VCPKG_ROOT "bootstrap-vcpkg.bat") -disableMetrics'

      # Los paquetes ya compilados (SDL3, GoogleTest) se guardan entre corridas. Una clave que ya
      # existe no se vuelve a guardar, así que lleva la imagen del runner: cuando cambia el
      # compilador, la primera corrida recompila y guarda una caché nueva.
      - name: Caché de binarios de vcpkg
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ env.RUNNER_IMAGE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.RUNNER_IMAGE }}-

      - name: Configurar
        run: cmake --preset ${{ matrix.configure-preset }} -DMURET_WARNINGS_AS_ERRORS=ON

      - name: Compilar
        run: cmake --build --preset ${{ matrix.build-preset }}

      - name: Tests
        run: ctest --preset ${{ matrix.test-preset }}

      # Los tests con la etiqueta gl (desde la CL5.0, los de labs/cl5.0-pipeline/gl/) abren una
      # ventana escondida con OpenGL 3.3 core, dibujan en un framebuffer y leen los píxeles. En el
      # paso de Tests se saltean porque no hay pantalla; acá corren en Xvfb con
      # MURET_CLIENT_REQUIRE_GL=1, que los hace fallar si el Xvfb no da el contexto, en vez de
      # dejarlos salteados en silencio. Con --no-tests=error, si ningún test lleva la etiqueta,
      # también falla. La etiqueta es una regex: '^gl$' no toma otra que la contenga. En Windows
      # no va: el runner tiene solo el OpenGL 1.1 de GDI.
      - name: Tests de GL en Xvfb (Linux)
        if: runner.os == 'Linux'
        env:
          MURET_CLIENT_REQUIRE_GL: 1
        run: xvfb-run -a -s '-screen 0 800x600x24' ctest --preset ${{ matrix.test-preset }} -L '^gl$' --no-tests=error

      # El hola mundo de la CL0.3: abre la ventana con OpenGL 3.3 core, dibuja 60 frames y sale.
      # En Windows no hay driver de OpenGL 3.3 en el runner (solo el 1.1 de GDI), así que va solo acá.
      # Con --vsync off, el bucle de la CL3.2 corre sin esperar el retrazo; con --pacing faithful,
      # al ritmo del original (VSync apagado, como pide ese modo).
      - name: Ventana de la CL0.3 en Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 800x600x24' build/${{ matrix.configure-preset }}/Client/Main --frames 60
          xvfb-run -a -s '-screen 0 800x600x24' build/${{ matrix.configure-preset }}/Client/Main --frames 60 --vsync off
          xvfb-run -a -s '-screen 0 800x600x24' build/${{ matrix.configure-preset }}/Client/Main --frames 60 --pacing faithful
