# Temporary: runs Client/tools/windows/build.ps1 on a Windows runner before its PR opens. Deleted before the PR.
name: Try the Windows build script

on:
  push:
    branches: [claude/project-thread-jfcfs0]

permissions:
  contents: read

jobs:
  script:
    name: build.ps1 (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: vcpkg binary cache folder
        shell: bash
        run: |
          temp="$(cygpath -m "$RUNNER_TEMP")"
          mkdir -p "$temp/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$temp/vcpkg-cache" >> "$GITHUB_ENV"
          echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      # The same key as ci.yml, so the packages main already built come from its cache.
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ env.RUNNER_IMAGE }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}
          restore-keys: vcpkg-${{ env.RUNNER_IMAGE }}-

      - name: build.cmd -Package (Windows PowerShell)
        shell: cmd
        run: Client\tools\windows\build.cmd -Package -Jobs 2

      - name: build.ps1 -Package -NoData again (PowerShell 7)
        shell: pwsh
        run: ./Client/tools/windows/build.ps1 -Package -NoData -Jobs 2

      - name: What the packages hold
        shell: pwsh
        run: |
          Get-ChildItem build/package -File | Format-Table -AutoSize Name, Length
          Get-ChildItem build/package -Directory | ForEach-Object {
            $_.Name
            Get-ChildItem $_.FullName | Format-Table -AutoSize Name, Length
            Get-Content (Join-Path $_.FullName 'muret-client.ini')
          }
          Get-Content build/windows-x64-ninja-release/muret-client.ini

      - uses: actions/upload-artifact@v7
        with:
          name: muret-client-windows-x64-no-data
          path: build/package/*-no-data.zip
          retention-days: 7
